name: Contracts

on:
  push:
    branches: [master]
    paths:
      - "contracts/**"
  pull_request:
    branches: [master]
    paths:
      - "contracts/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Pin stable so locked dependency resolution matches local/CI.
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      # Use --locked so CI fails if Cargo.lock is missing or out of sync
      # (reproducible builds for this deployable Soroban workspace).
      - name: Build (release, locked)
        run: cargo build --locked --target wasm32-unknown-unknown --release

      - name: Run tests (locked)
        run: cargo test --locked

      - name: Property-based tests (escrow invariants)
        env:
          PROPTEST_CASES: 1000
        run: cargo test --locked -p production_escrow proptest
