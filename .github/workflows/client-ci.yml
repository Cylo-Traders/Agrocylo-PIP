name: Client CI

on:
  push:
    branches: [master, main]
    paths:
      - "client/**"
      - ".github/workflows/client-ci.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "client/**"
      - ".github/workflows/client-ci.yml"

# A newer push to the same PR cancels the previous run instead of queueing
# behind it, so contributors see the result for their latest commit.
concurrency:
  group: client-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Must satisfy every tool's `engines` range — lint-staged 17 needs
          # >= 22.22.1, which Node 20 does not meet.
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (fail on new high/critical)
        run: node scripts/check-prod-audit.mjs

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
