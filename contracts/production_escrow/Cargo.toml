[package]
name = "production_escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
escrow_types = { path = "../escrow_types" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1.5"

[features]
testutils = ["soroban-sdk/testutils", "escrow_types/testutils"]
