[package]
name = "production_escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
# Cross-contract client + shared activity/status types for optional registry sync.
registry = { path = "../registry" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1.5"
registry = { path = "../registry", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils", "registry/testutils"]
