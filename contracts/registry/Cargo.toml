[package]
name = "registry"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
# Types only — see src/escrow.rs for why the escrow *contract* crate must not
# be linked into this one.
escrow_types = { path = "../escrow_types" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils", "escrow_types/testutils"]